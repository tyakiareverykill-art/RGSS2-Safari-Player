<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGSS2 Player prototype</title><style>body{background:#111827;color:white;font:16px system-ui;margin:16px}button{font:inherit;min-width:54px;min-height:54px;touch-action:none;user-select:none}#screen{background:#000;aspect-ratio:4/3;display:grid;place-items:center;max-height:50vh}#controls{display:flex;justify-content:space-between;margin-top:12px;gap:12px}.pad{display:grid;grid-template-columns:repeat(3,54px);gap:4px}.actions{display:flex;align-items:center;gap:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>RGSS2 Player 試作</h1><p>ZIPの構造確認と操作入力のテスト専用。ゲーム実行エンジンは未接続です。</p><input id="file" type="file" accept=".zip,application/zip"><pre id="report"></pre><div id="screen">エンジン未接続</div><div id="controls"><div class="pad"><span></span><button data-key="ArrowUp">↑</button><span></span><button data-key="ArrowLeft">←</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button></div><div class="actions"><button data-key="Escape">B</button><button data-key="Enter">A</button></div></div><p id="keys">入力なし</p><script>
const report=document.querySelector('#report');
document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const tail=await f.slice(Math.max(0,f.size-65557)).arrayBuffer(),v=new DataView(tail);let i=v.byteLength-22;for(;i>=0;i--)if(v.getUint32(i,true)===0x06054b50&&i+22+v.getUint16(i+20,true)===v.byteLength)break;if(i<0)throw Error('ZIP末尾が見つかりません');const count=v.getUint16(i+10,true),size=v.getUint32(i+12,true),offset=v.getUint32(i+16,true);if(count===65535||size>16777216||offset+size>f.size||v.getUint16(i+4,true)||v.getUint16(i+6,true))throw Error('ZIP64・分割ZIP・巨大な索引は未対応');const d=new DataView(await f.slice(offset,offset+size).arrayBuffer());let p=0,names=[];for(let j=0;j<count;j++){if(p+46>d.byteLength||d.getUint32(p,true)!==0x02014b50)throw Error('ZIP索引が不正');const n=d.getUint16(p+28,true),x=d.getUint16(p+30,true),c=d.getUint16(p+32,true);if(p+46+n+x+c>d.byteLength)throw Error('ZIP索引が不正');names.push(new TextDecoder().decode(new Uint8Array(d.buffer,p+46,n)));p+=46+n+x+c}const has=r=>names.some(n=>r.test(n));const type=has(/\.rgss2a$|\.rvdata$/i)?'VX':has(/\.rgss3a$|\.rvdata2$/i)?'VX Ace':has(/\.rgssad$|\.rxdata$/i)?'XP':'未判定';report.textContent=f.name+'\n'+count+' entries / '+(f.size/1048576).toFixed(1)+' MB\n推定: '+type+'\n'+names.filter(n=>/Game\.(ini|exe|rgss\w+)$|\.dll$/i.test(n)).slice(0,30).join('\n')}catch(err){report.textContent=err.message}};
const pressed=new Map();function show(){document.querySelector('#keys').textContent=[...new Set(pressed.values())].join(' + ')||'入力なし'}document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pressed.set(e.pointerId,b.dataset.key);show()};b.onpointerup=b.onpointercancel=b.onlostpointercapture=e=>{pressed.delete(e.pointerId);show()}});window.addEventListener('blur',()=>{pressed.clear();show()});
</script></html>
