<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGSS2 engine smoke test</title><style>body{background:#111827;color:white;font:16px system-ui;padding:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:12px;font:inherit}canvas{max-width:100%}</style><h1>RGSS2 エンジン起動診断</h1><p>ゲームなしでWASMとRuby実行環境の初期化を確認します。ゲーム本体の起動テストではありません。</p><button id="start">診断開始</button><pre id="log"></pre><canvas id="canvas" width="544" height="416"></canvas><script>
const log=s=>document.getElementById('log').textContent+=String(s)+'\n';
window.addEventListener('error',e=>log('ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>log('REJECTION: '+e.reason));
document.getElementById('start').onclick=async function(){this.disabled=true;try{log(navigator.userAgent);log('WebAssembly: '+typeof WebAssembly);const r=await fetch('mkxp.wasm');if(!r.ok)throw Error('HTTP '+r.status);const b=await r.arrayBuffer();log('WASM bytes: '+b.byteLength);await WebAssembly.compile(b);log('WASM compile: OK');window.Module={noInitialRun:true,wasmBinary:new Uint8Array(b),canvas:document.getElementById('canvas'),print:log,printErr:log,onAbort:x=>log('ABORT: '+x),onRuntimeInitialized:()=>log('Emscripten runtime initialized: OK (game main not called)')};const s=document.createElement('script');s.src='mkxp.js';s.onerror=()=>log('JS load failed');document.head.appendChild(s)}catch(e){log('ERROR: '+e.stack)}};
</script></html>
