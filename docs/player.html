<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RGSS2 Safari Player</title><style>
*{box-sizing:border-box}body{background:#101624;color:#fff;font:16px system-ui;margin:0;padding:16px}button,input{font:inherit}button{background:#29364c;color:white;border:1px solid #63748e;border-radius:12px;padding:12px}canvas{display:block;width:100%;max-width:544px;margin:auto;background:#000}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#controls{display:flex;justify-content:space-between;align-items:center;max-width:544px;margin:12px auto;touch-action:none;user-select:none}#pad{width:132px;height:132px;border-radius:50%;background:#29364c;position:relative;touch-action:none}#pad span{position:absolute;pointer-events:none;font-size:24px}#pad:active{background:#41546e}#buttons{display:grid;grid-template-columns:repeat(2,64px);gap:10px}#buttons button{height:58px;touch-action:none}details{margin-top:12px}label{display:block;margin:10px 0}
</style><h2>RGSS2 Safari Player</h2><p>実験版：RPGツクールVXのゲームZIPを端末内で読み込みます。</p><label>ゲームZIP <input id="zip" type="file" accept=".zip,application/zip"></label><button id="start">ゲーム起動</button> <button onclick="location.reload()">リセット</button><p id="status">ZIPを選択してください</p><canvas id="canvas" width="544" height="416" tabindex="0"></canvas><div id="controls"><div id="pad" aria-label="方向キー"><span style="top:5px;left:55px">▲</span><span style="bottom:5px;left:55px">▼</span><span style="left:8px;top:48px">◀</span><span style="right:8px;top:48px">▶</span></div><div id="buttons"><button data-key="Escape">B</button><button data-key="Enter">A</button><button data-key="Shift">走る</button><button data-key="KeyX">メニュー</button></div></div><details open><summary>起動ログ</summary><pre id="log"></pre></details><script src="fflate.js"></script><script>
const $=id=>document.getElementById(id),log=s=>{$('log').textContent+=String(s)+'\n';},status=s=>{$('status').textContent=s;log(s)},canvas=$('canvas');
window.addEventListener('error',e=>log('ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>log('REJECTION: '+e.reason));
const codes={ArrowUp:38,ArrowDown:40,ArrowLeft:37,ArrowRight:39,Enter:13,Escape:27,Shift:16,KeyX:88};
function key(k,down){if(!k)return;const e=new KeyboardEvent(down?'keydown':'keyup',{key:k==='KeyX'?'x':k,code:k==='Shift'?'ShiftLeft':k,keyCode:codes[k],which:codes[k],bubbles:true,cancelable:true});canvas.dispatchEvent(e)}
let dir=null;const pad=$('pad');function move(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const next=Math.hypot(x,y)<12?null:Math.abs(x)>Math.abs(y)?(x>0?'ArrowRight':'ArrowLeft'):(y>0?'ArrowDown':'ArrowUp');if(next!==dir){key(dir,false);dir=next;key(dir,true)}}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);move(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))move(e)};pad.onpointerup=pad.onpointercancel=pad.onlostpointercapture=()=>{key(dir,false);dir=null};
document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);key(b.dataset.key,true)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>key(b.dataset.key,false)});
$('start').onclick=async function(){const f=$('zip').files[0];if(!f)return status('ZIPを選択してください');this.disabled=true;try{if(f.size>150*1024*1024)throw Error('初期試験ではZIP 150MB以下に制限しています');status('ZIP展開中');let total=0;const files=fflate.unzipSync(new Uint8Array(await f.arrayBuffer()),{filter:x=>{total+=x.originalSize;if(total>300*1024*1024)throw Error('展開上限300MB');return !x.name.endsWith('/')}});const names=Object.keys(files);const ini=names.find(n=>/(^|\/)Game\.ini$/i.test(n));if(!ini)throw Error('Game.ini が見つかりません');const root=ini.slice(0,-8);const selected=names.filter(n=>n.startsWith(root));status('ゲームファイル '+selected.length+' 件');window.Module={noInitialRun:true,canvas,print:log,printErr:log,onAbort:x=>status('ABORT: '+x),onRuntimeInitialized:()=>{setTimeout(()=>{try{const bridge=window.RGSSBridge;if(!bridge||!bridge.fs||!bridge.main)throw Error('FS / callMain が利用できません');const fs=bridge.fs;fs.mkdirTree('/game');for(const n of selected){const rel=n.slice(root.length);if(!rel||rel.split('/').some(p=>p==='..'||p==='.')||rel.includes('\\')||rel.startsWith('/'))continue;const dest='/game/'+rel;fs.mkdirTree(dest.slice(0,dest.lastIndexOf('/')));fs.writeFile(dest,files[n]);}fs.chdir('/game');status('ゲーム本体を起動します');canvas.focus();bridge.main([]);}catch(e){status('起動失敗: '+e.stack)}},0)}};const s=document.createElement('script');s.src='mkxp.js';s.onerror=()=>status('エンジン読み込み失敗');document.head.appendChild(s)}catch(e){status('ERROR: '+e.message);this.disabled=false}};
</script></html>
