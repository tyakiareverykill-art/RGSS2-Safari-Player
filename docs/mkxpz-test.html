</style></head><body><h2>mkxp-z / CRuby V13</h2><p id="status"></p><button id="isolate">分離環境を準備・再読込</button><input id="file" type="file" accept=".zip,.mkxpz,.7z"><button id="start">起動</button><canvas id="canvas" width="544" height="416"></canvas><div id="pad"><div><button data-key="ArrowUp">↑</button><br><button data-key="ArrowLeft">←</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button></div><div><button data-key="z">Z</button><button data-key="x">X</button><br><button data-key="Shift">Shift</button><button data-key="Escape">Menu</button></div></div><button id="copylog">ログをコピー</button><pre id="log"></pre><script type="module">
const $=id=>document.getElementById(id), log=m=>{$('log').textContent+=String(m)+'\n';$('log').scrollTop=$('log').scrollHeight};

let instance, Nostalgist;
const NativeURL=window.URL;
window.URL=new Proxy(NativeURL,{construct(target,args,newTarget){try{return Reflect.construct(target,args,newTarget)}catch(e){const name=String(args[0]),base=String(args[1]||'');if(base.startsWith('blob:'+location.origin+'/')&&(name==='.'||/^mkxp[-_]z_libretro\.(js|wasm)$/.test(name))){const resolved=new NativeURL(name==='.'?'./cores/':'./cores/'+name.replace('mkxp-z','mkxp_z'),location.href);log('Worker URL repaired: '+resolved.href);return resolved}log('URL failure: '+JSON.stringify(args.map(String))+' / '+String(e));throw e}}});
const NativeWorker=window.Worker;
window.Worker=new Proxy(NativeWorker,{construct(target,args,newTarget){log('Worker URL: '+String(args[0]));const w=Reflect.construct(target,args,newTarget);w.addEventListener('error',e=>log('Worker error: '+e.message));return w}});
(async()=>{for(const url of ['https://cdn.jsdelivr.net/npm/nostalgist@0.20.2/+esm','https://esm.sh/nostalgist@0.20.2?target=es2022']){try{log('Loading '+url);const m=await import(url);Nostalgist=m.Nostalgist;if(!Nostalgist)throw Error('Missing Nostalgist export');log('Nostalgist loaded');return}catch(e){log('Import failed: '+e)}}log('All library imports failed')})();
$('start').onclick=async()=>{const file=$('file').files[0];if(!file||!Nostalgist){log('ファイルまたはライブラリ未準備');return}if(!crossOriginIsolated){log('先に分離環境を準備してください');return}$('start').disabled=true;try{const base=new URL('./cores/',location.href);const zip=new Uint8Array(await file.arrayBuffer());const dv=new DataView(zip.buffer);let end=-1;for(let i=zip.length-22;i>=Math.max(0,zip.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50&&i+22+dv.getUint16(i+20,true)===zip.length){end=i;break}}if(end<0)throw Error('ZIP central directory not found');let pos=dv.getUint32(end+16,true);const count=dv.getUint16(end+10,true),entries=[];for(let i=0;i<count;i++){if(dv.getUint32(pos,true)!==0x02014b50)throw Error('Invalid ZIP directory');const n=dv.getUint16(pos+28,true),x=dv.getUint16(pos+30,true),c=dv.getUint16(pos+32,true);const raw=zip.slice(pos+46,pos+46+n);const name=new TextDecoder('utf-8').decode(raw);entries.push({name,raw,pos,n,x,c,offset:dv.getUint32(pos+42,true)});pos+=46+n+x+c}log('ZIP entries: '+count);for(const e of entries.slice(0,35))log('ZIP '+e.name);const ini=entries.filter(e=>/(^|\/)Game\.ini$/i.test(e.name));if(ini.length!==1)throw Error('Expected one Game.ini, found '+ini.length);const prefix=ini[0].name.slice(0,-8);log('Game root: '+(prefix||'/'));let rom=file;if(prefix){const cut=ini[0].raw.length-8;const parts=[],central=[];let offset=0,centralSize=0;for(const e of entries){if(!e.name.startsWith(prefix)||e.raw.length<=cut)continue;const name=e.raw.slice(cut),p=e.offset;if(dv.getUint32(p,true)!==0x04034b50)throw Error('Invalid local ZIP header');const ln=dv.getUint16(p+26,true),lx=dv.getUint16(p+28,true),size=dv.getUint32(e.pos+20,true);const flags=dv.getUint16(p+6,true);if(flags&8)throw Error('ZIP data descriptor requires repacking');const h=zip.slice(p,p+30);new DataView(h.buffer).setUint16(26,name.length,true);parts.push(h,name,zip.subarray(p+30+ln,p+30+ln+lx+size));const ch=zip.slice(e.pos,e.pos+46);const cd=new DataView(ch.buffer);cd.setUint16(28,name.length,true);cd.setUint32(42,offset,true);const tail=zip.subarray(e.pos+46+e.n,e.pos+46+e.n+e.x+e.c);central.push(ch,name,tail);centralSize+=46+name.length+tail.length;offset+=30+name.length+lx+size}const footer=new Uint8Array(22),f=new DataView(footer.buffer);f.setUint32(0,0x06054b50,true);f.setUint16(8,central.length/3,true);f.setUint16(10,central.length/3,true);f.setUint32(12,centralSize,true);f.setUint32(16,offset,true);rom=new File([...parts,...central,footer],'game.mkxpz');log('Flattened ZIP bytes: '+rom.size)}else{log('Game.ini already at ZIP root')}rom=new File([rom],'game.mkxpz');log('Launching '+rom.name);instance=await Nostalgist.prepare({element:$('canvas'),core:{name:'mkxp-z',js:new URL('mkxp_z_libretro.js',base).href,wasm:new URL('mkxp_z_libretro.wasm',base).href},rom:{fileName:'game.mkxpz',fileContent:rom},emscriptenModule:{print:(m)=>log('STDOUT '+m),printErr:(m)=>log('STDERR '+m)},retroarchConfig:{log_verbosity:true,stdin_cmd_enable:true,video_shader_enable:false},onLog:(...args)=>log('CORE '+args.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' '))});const fs=instance.getEmscriptenFS();const mod=instance.getEmscripten().Module;log('FS.init: '+typeof fs.init+' / FS.writeFile: '+typeof fs.writeFile+' / FS.readFile: '+typeof fs.readFile+' / EmscriptenSendCommand: '+typeof mod.EmscriptenSendCommand);if(typeof fs.writeFile!=='function'||typeof fs.readFile!=='function')throw Error('FS read/write API missing');const probe='/rgss-fs-probe.txt';fs.writeFile(probe,new Uint8Array([82,71,83,83]));try{if(String(fs.readFile(probe))!=='82,71,83,83')throw Error('FS probe mismatch');log('FS read/write probe OK')}finally{fs.unlink(probe)}log('V13: inspecting virtual filesystem');try{let count=0;function walk(p,d){if(d>9||count>300)return;for(const n of fs.readdir(p)){if(n==='.'||n==='..'||count++>300)continue;const q=p.replace(/\/$/,'')+'/'+n;try{const st=fs.stat(q);log('FS '+q+' size='+st.size);if((st.mode&61440)===16384&&q!=='/proc'&&q!=='/dev')walk(q,d+1)}catch(e){log('FS stat '+e)}}}walk('/',0)}catch(e){log('FS listing error: '+e)}log('Selected ROM bytes: '+rom.size);try{const p='/home/web_user/retroarch/userdata/content';log('Content entries: '+JSON.stringify(fs.readdir(p)));log('RetroArch config: '+fs.readFile('/home/web_user/retroarch/userdata/retroarch.cfg',{encoding:'utf8'}))}catch(e){log('Content inspection: '+e)}const contentEntries=fs.readdir('/home/web_user/retroarch/userdata/content');if(!contentEntries.includes('game.mkxpz'))throw Error('Expected game.mkxpz missing: '+contentEntries.join(', '));log('ROM extension verified: game.mkxpz');log('Starting core');await instance.start();log('Launch returned');for(const sec of [5,15,30])setTimeout(()=>{log('After '+sec+'s: canvas '+$('canvas').width+'x'+$('canvas').height+' / visibility '+document.visibilityState+' / HEAP '+(mod.HEAPU8?.byteLength??'unknown'))},sec*1000)}catch(e){log('Launch error: '+String(e));log(e.stack||'No stack');$('start').disabled=false}};
for(const b of document.querySelectorAll('[data-key]')){const key=b.dataset.key;const send=(type)=>{const code=key.length===1?'Key'+key.toUpperCase():key==='Shift'?'ShiftLeft':key;const ev=new KeyboardEvent(type,{key,code,bubbles:true,cancelable:true});$('canvas').dispatchEvent(ev)};b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);send('keydown')};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>send('keyup')}
</script></body></html>
