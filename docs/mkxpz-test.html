const zipLib=()=>import('https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.57/+esm');

    throw Error(selectionError || '保存済みRTPが見つかりません。公式VX RTP ZIPを展開するか、展開済みZIPを選択してください。');

async function saveRtp(blob){const z=await zipLib(),reader=new z.ZipReader(new z.BlobReader(blob));let count=0,town=false,graphics=false;try{const entries=await reader.getEntries();const assets=entries.filter(e=>!e.directory&&assetPath(e.filename));if(!assets.length)throw Error('RTP素材がありません');const root=await rtpRoot(true);try{await root.removeEntry('.complete')}catch(e){if(e.name!=='NotFoundError')throw e}for(const e of assets){const p=assetPath(e.filename);let dir=root;for(const n of p.slice(0,-1))dir=await dir.getDirectoryHandle(n,{create:true});const h=await dir.getFileHandle(p.at(-1),{create:true});const out=await h.createWritable();try{await out.write(await e.getData(new z.BlobWriter()));await out.close()}catch(err){await out.abort();throw err}count++;town||=/^Audio\/BGM\/Town5\.[^/]+$/i.test(p.join('/'));graphics||=p[0]==='Graphics';if(count%50===0)$('rtpStatus').textContent='保存中 '+count+' 件'}if(!town||!graphics)throw Error('Town5またはGraphicsが不足');const mark=await (await root.getFileHandle('.complete',{create:true})).createWritable();await mark.write(String(count));await mark.close();log('RTP OPFS saved: '+count+' files; Town5 OK');$('rtpStatus').textContent='RTP保存済み '+count+' 件'}finally{await reader.close()}}
$('extractRtp').onclick=async()=>{const file=$('officialRtp').files[0];if(!file)return log('公式RTP ZIPを選択してください');$('extractRtp').disabled=$('start').disabled=$('exportRtp').disabled=true;let worker;try{const z=await zipLib(),r=new z.ZipReader(new z.BlobReader(file));let exe;try{const e=(await r.getEntries()).find(e=>!e.directory&&/(^|[\\/])setup\.exe$/i.test(e.filename));if(!e)throw Error('Setup.exeが見つかりません');exe=new File([await e.getData(new z.BlobWriter())],'setup.exe')}finally{await r.close()}$('rtpStatus').textContent='展開中';worker=new Worker('./rtp-worker.js');const blob=await new Promise((resolve,reject)=>{worker.onmessage=e=>{if(e.data.error)reject(Error(e.data.error));else if(e.data.blob)resolve(e.data.blob);else if(e.data.log)log(e.data.log)};worker.onerror=e=>reject(Error(e.message));worker.postMessage(exe)});worker.terminate();worker=null;try{await saveRtp(blob)}catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RPGVX-extracted.zip';a.textContent='展開済みRTP ZIPを保存（端末保存失敗時）';$('rtpStatus').after(a);throw e}}catch(e){log('RTP extraction error: '+e);$('rtpStatus').textContent=String(e)}finally{worker?.terminate();$('extractRtp').disabled=$('start').disabled=$('exportRtp').disabled=false}};

async function mountSavedRtp(fs,sys,mkdir,preflightRoot){let root;try{root=preflightRoot||await rtpRoot();await root.getFileHandle('.complete')}catch(e){if(e.name==='NotFoundError'||!navigator.storage?.getDirectory)return 0;throw e}let count=0;for await(const [name,file] of storedFiles(root)){const dest=sys+'/RTP/RPGVX/'+name;mkdir(dest.slice(0,dest.lastIndexOf('/')));try{fs.writeFile(dest,new Uint8Array(await file.arrayBuffer()))}catch(e){throw Error('RTP file '+name+': '+e.name+' '+e.message)}count++;if(count%25===0)log('RTP mount progress: '+count)}log('OPFS RTP mounted: '+count+' files');return count}

const largeGameBytes = 192 * 1024 * 1024;
const opfsMount = '/rgss2/game-files';

async function originalGameHandle(dir) {
  try {
    return await dir.getFileHandle('original.zip');
  } catch (error) {
    if (error.name !== 'NotFoundError') throw error;
    return dir.getFileHandle('original.mkxpz');

async function gameHash(file, large) {
  if (!large) {
    const digest = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
    return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2,'0')).join('');
  }
  const {sha256:incrementalSha256} = await import('https://cdn.jsdelivr.net/npm/@noble/hashes@1.8.0/sha256/+esm');
  const hash = incrementalSha256.create();
  const chunk = 4 * 1024 * 1024;
  for (let offset = 0; offset < file.size; offset += chunk) {
    hash.update(new Uint8Array(await file.slice(offset, offset + chunk).arrayBuffer()));
  }
  return Array.from(hash.digest(), byte => byte.toString(16).padStart(2,'0')).join('');
}

async function writeGameBlob(dir, name, blob) {
  const file = await dir.getFileHandle(name,{create:true});
  const out = await file.createWritable();
  try {
    await blob.stream().pipeTo(out);
  } catch (error) {
    if (error.name === 'QuotaExceededError') {
      const estimate = await navigator.storage.estimate?.().catch(() => null);
      const free = estimate?.quota && Number.isFinite(estimate.usage)
        ? '。Safariが報告する空き容量: 約' + Math.round((estimate.quota-estimate.usage)/1048576) + ' MiB'
        : '';
      throw Error('サイトの保存容量が不足しています' + free);
    }
    throw error;
  }
  const result = await file.getFile();
  if (result.size !== blob.size) throw Error('端末に書き込んだZIPのサイズが一致しません');
  return result;
}

async function persistGame(file, large) {
  const id = await gameHash(file, large);
  const dir = await (await gameStore()).getDirectoryHandle(id,{create:true});
  let existing;
  try { existing = await (await originalGameHandle(dir)).getFile(); }
  catch (error) { if (error.name !== 'NotFoundError') throw error; }
  if (existing?.size !== file.size) {
    if (large) await writeGameBlob(dir,'original.mkxpz',file);
    else await putLocal(dir,'original.zip',file);
  }
  await putLocal(dir,'meta.json',JSON.stringify({name:file.name,size:file.size}));
  await refreshGames();
  $('savedGame').value=id;
  selectLastGame(id);
  return dir;
}

const saveDirectory = '/home/web_user/retroarch/userdata/saves';
const saveRoots = [saveDirectory, '/home/web_user/retroarch/userdata/content'];
function saveCandidate(p){return /\.(rvdata2?|rxdata|sav|save|srm)$/i.test(p)&&!p.includes('/Data/')}
async function restoreGameSaves(fs, dir, mkdir) {
  let store;
  try { store = await dir.getDirectoryHandle('saves'); }
  catch (error) { if (error.name === 'NotFoundError') return 0; throw error; }
  let restored = 0;
  const legacy = [];
  function restore(path, bytes) {
    mkdir(path.slice(0, path.lastIndexOf('/')));
    fs.writeFile(path, bytes);
    log('Restored save: ' + path);
  }
  for await (const [name, handle] of store.entries()) {
    if (handle.kind !== 'file') continue;
    let path;
    try { path = decodeURIComponent(name); } catch (_) { continue; }
    if (!isCloudSavePath(path)) continue;
    const bytes = new Uint8Array(await (await handle.getFile()).arrayBuffer());
    if (!bytes.byteLength) continue;
    restore(path, bytes);
    restored++;
    const corePath = path.match(/\/mkxp-z\/Saves\/.+$/)?.[0];
    if (corePath && path !== saveDirectory + corePath) legacy.push({path: saveDirectory + corePath, bytes});
  }
  for (const {path, bytes} of legacy) {
    let present;
    try { present = fs.stat(path); } catch (_) {}
    if (!present) restore(path, bytes);
  }
  return restored;
}
const cloudProtocol = 'rgss2-drive-v1';

let drive;
const cloudStatus = message => { $('driveStatus').textContent = message; };
const sha256 = async value => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', typeof value === 'string' ? new TextEncoder().encode(value) : value)), byte => byte.toString(16).padStart(2,'0')).join('');
const isHash = value => typeof value === 'string' && /^[a-f0-9]{64}$/.test(value);
function isCloudSavePath(path) {
  return typeof path === 'string' && path.length <= 1024 && saveRoots.some(root => path.startsWith(root + '/')) &&
    saveCandidate(path) && !/[\\\x00-\x1f]/.test(path) && !path.slice(1).split('/').some(part => !part || part === '.' || part === '..');
}
const driveSessionKey = cloudProtocol + ':session';
const validDriveEndpoint = endpoint => typeof endpoint === 'string' && /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint);

function watchDrive(endpoint, nonce) {
  if (drive) {
    for (const pending of drive.pending.values()) {
      clearTimeout(pending.timeout);
      pending.reject(Error('接続を切り替えました'));
    }
    drive.pending.clear();
    drive.channel.close();
  }
  const channel = new BroadcastChannel(cloudProtocol + ':' + nonce);
  const connection = {channel, ready:false, pending:new Map(), checking:null};
  drive = connection;
  channel.onmessage = ({data}) => {
    if (data?.type === 'bridge') channel.postMessage({type:'configure', endpoint});
    else if (data?.type === 'ready') void verifyDrive(connection);
    else if (data?.type === 'response') {
      const pending = connection.pending.get(data.id);
      if (!pending) return;
      clearTimeout(pending.timeout);
      connection.pending.delete(data.id);
      if (data.error) pending.reject(Error(data.error));
      else pending.resolve(data.result);
    }
  };
  return connection;
}

function verifyDrive(connection) {
  if (!connection.checking) {
    cloudStatus('Googleドライブに接続中…');
    connection.checking = driveRequest({action:'list', game:'0'.repeat(64)}, connection, 3000)
      .then(() => {
        if (drive !== connection) return;
        connection.ready = true;
        cloudStatus('Googleドライブ接続済み');
      }, () => {
        if (drive !== connection) return;
        connection.ready = false;
        cloudStatus('Google連携タブを開いて「接続」を押すと同期できます。端末保存は利用できます。');
      })
      .finally(() => { connection.checking = null; });
  }
  return connection.checking;
}

$('connectDrive').onclick = () => {

function driveRequest(request, connection = drive, deadline = 12000) {
  if (!connection) return Promise.reject(Error('Googleドライブ未接続'));
  return new Promise((resolve, reject) => {
    const random = crypto.getRandomValues(new Uint32Array(2));
    const id = (random[0] & 0x1fffff) * 0x100000000 + random[1];
    const timeout = setTimeout(() => {
      connection.pending.delete(id);
      reject(Error('Googleドライブの応答待ちがタイムアウトしました'));
    }, deadline);
    connection.pending.set(id, {resolve, reject, timeout});
    connection.channel.postMessage({type: 'request', id, request});
  });
}

async function prepareDriveSaves(dir, game, connection) {
  const saves = await dir.getDirectoryHandle('saves', {create:true});
  const metadata = await dir.getDirectoryHandle('drive-sync-v1', {create:true});
  const local = new Map();
  const conflicts = new Set();
  const remote = new Map();
  const rpc = (action, params = {}) => driveRequest({action, game, ...params}, connection);

    let path;
    try { path = decodeURIComponent(name); } catch (_) { continue; }
    if (isCloudSavePath(path)) local.set(await sha256(path), {path, handle});

  const entries = await rpc('list');
  for (const {slot, hash} of entries) {

    remote.set(slot, hash);
  }
  for (const [slot, hash] of remote) {
    const file = local.get(slot);
    if (file) {
      const localHash = await sha256(await (await file.handle.getFile()).arrayBuffer());
      if (localHash === hash) {
        await setBaseline(slot, hash);
        continue;
      }
      let baseline;
      try { baseline = await (await (await metadata.getFileHandle(slot)).getFile()).text(); }
      catch (error) { if (error.name !== 'NotFoundError') throw error; }
      if (baseline === hash) continue;
      if (baseline !== localHash) {
        conflicts.add(slot);
        continue;

    await setBaseline(slot, hash);

      conflicts.add(slot);
      cloudStatus('競合したセーブは端末とドライブの両方に保持しています。');
      return;
    }
    if (result.status !== 'ok' || result.hash !== hash) throw Error('Googleドライブの保存応答を検証できません');
    await setBaseline(slot, hash);
    uploaded.set(slot, hash);
    if (!conflicts.size) cloudStatus('Googleドライブ保存済み ' + new Date().toLocaleTimeString());
  };
}

function monitorGameSaves(fs, dir, syncDrive) {
  const button = $('flushSave');
  const status = $('saveStatus');
  const seen = new Map();
  const queued = new Map();
  let scan, syncing = false, retryAt = 0;

  function uploadSaves() {
    if (syncing || !queued.size || Date.now() < retryAt) return;
    syncing = true;
    void (async () => {
      try {
        for (const [path, save] of queued) {
          await syncDrive(path, save.bytes, save.hash);
          if (queued.get(path) === save) queued.delete(path);
        }
      } catch (error) {
        cloudStatus('同期を再試行します。ゲーム内セーブは端末に保存済みです。');
        log('Drive sync: ' + error.message);
        retryAt = Date.now() + 30000;
      } finally {
        syncing = false;
      }
    })();
  }

  async function scanSaves() {
    const store = await dir.getDirectoryHandle('saves', {create:true});
    let count = 0, updated = 0;
    async function walk(path, depth) {
      if (depth > 12) return;
      let names;
      try { names = fs.readdir(path); } catch (_) { return; }
      for (const name of names) {
        if (name === '.' || name === '..' || name === 'Data') continue;
        const file = path + '/' + name;
        let info;
        try { info = fs.stat(file); } catch (_) { continue; }
        const kind = info.mode & 0xf000;
        if (kind === 0x4000) {
          await walk(file, depth + 1);
          continue;
        }
        if (kind !== 0x8000 || !isCloudSavePath(file) || info.size === 0) continue;
        const bytes = fs.readFile(file);
        if (!bytes.byteLength) continue;
        count++;
        const hash = await sha256(bytes);
        if (seen.get(file) === hash) continue;
        await putLocal(store, encodeURIComponent(file), bytes);
        seen.set(file, hash);
        if (syncDrive) queued.set(file, {bytes, hash});
        updated++;
        log('Saved locally: ' + file);
      }
    }

    for (const path of saveRoots) await walk(path, 0);
    if (updated) status.textContent = '端末に保存済み ' + new Date().toLocaleTimeString();
    return count;
  }

  function flush() {
    if (!scan) {
      scan = scanSaves().finally(() => {
        scan = undefined;
        uploadSaves();
      });
    }
    return scan;
  }

  function onError(error) {
    status.textContent = '端末への保存に失敗しました: ' + error.message;
    log(error);
  }

  button.disabled = false;
  button.onclick = async () => {
    button.disabled = true;
    button.textContent = '保存中…';
    try {
      const count = await flush();
      status.textContent = count
        ? '端末に保存済み：' + count + '件'
        : 'ゲーム内セーブが見つかりません。ゲームのセーブ画面で保存してください。';
      log('Manual save scan: ' + count + ' files');
    } catch (error) {
      onError(error);
    } finally {
      button.disabled = false;
      button.textContent = 'セーブを端末に保存';
    }
  };
  const autoSave = () => { void flush().catch(onError); };
  setInterval(autoSave, 750);
  document.addEventListener('visibilitychange', () => { if (document.hidden) autoSave(); });
  window.addEventListener('pagehide', autoSave);
  autoSave();
}
