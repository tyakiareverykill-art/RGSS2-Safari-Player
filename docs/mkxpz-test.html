</style></head><body><h2>mkxp-z / CRuby V17</h2><p id="status"></p><button id="isolate">分離環境を準備・再読込</button><input id="file" type="file" accept=".zip,.mkxpz,.7z"><p>日本語フォント（標準搭載・任意で上書き）</p><input id="font" type="file" accept=".ttf,.otf"><p>展開済み RPGVX RTP ZIP（任意）</p><input id="rtp" type="file" accept=".zip"><p>公式VX RTP ZIP（Setup.exe入り）</p><input id="officialRtp" type="file" accept=".zip"><button id="extractRtp">RTPを展開・端末に保存</button><button id="exportRtp">保存済みRTP ZIPを書き出す</button><p id="rtpStatus"></p><button id="start">起動</button><canvas id="canvas" width="544" height="416"></canvas><div id="pad"><div><button data-key="ArrowUp">↑</button><br><button data-key="ArrowLeft">←</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button></div><div><button data-key="z">Z</button><button data-key="x">X</button><br><button data-key="Shift">Shift</button><button data-key="Escape">Menu</button></div></div><button id="copylog">ログをコピー</button><pre id="log"></pre><script type="module">

const zipLib=()=>import('https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.57/+esm');
async function rtpRoot(create=false){const root=await navigator.storage.getDirectory();return (await root.getDirectoryHandle('rtp',{create})).getDirectoryHandle('RPGVX',{create})}
async function* storedFiles(dir,prefix=''){for await(const [name,h] of dir.entries()){if(h.kind==='directory')yield* storedFiles(h,prefix+name+'/');else if(name!=='.complete')yield [prefix+name,await h.getFile()]}}
function assetPath(name){const p=name.replace(/\\/g,'/').split('/');const i=p.findIndex(n=>/^(Audio|Graphics)$/i.test(n));if(i<0)return null;const a=p.slice(i);if(a.some(n=>!n||n==='.'||n==='..'||n.includes(':'))||/\.(dll|exe|ico)$/i.test(a.at(-1)))return null;a[0]=a[0].toLowerCase()==='audio'?'Audio':'Graphics';return a}
async function saveRtp(blob){const z=await zipLib(),reader=new z.ZipReader(new z.BlobReader(blob));let count=0,town=false,graphics=false;try{const entries=await reader.getEntries();const assets=entries.filter(e=>!e.directory&&assetPath(e.filename));if(!assets.length)throw Error('RTP素材がありません');const root=await rtpRoot(true);try{await root.removeEntry('.complete')}catch(e){if(e.name!=='NotFoundError')throw e}for(const e of assets){const p=assetPath(e.filename);let dir=root;for(const n of p.slice(0,-1))dir=await dir.getDirectoryHandle(n,{create:true});const h=await dir.getFileHandle(p.at(-1),{create:true});const out=await h.createWritable();try{await out.write(await e.getData(new z.BlobWriter()));await out.close()}catch(err){await out.abort();throw err}count++;town||=/^Audio\/BGM\/Town5\.[^/]+$/i.test(p.join('/'));graphics||=p[0]==='Graphics';if(count%50===0)$('rtpStatus').textContent='保存中 '+count+' 件'}if(!town||!graphics)throw Error('Town5またはGraphicsが不足');const mark=await (await root.getFileHandle('.complete',{create:true})).createWritable();await mark.write(String(count));await mark.close();log('RTP OPFS saved: '+count+' files; Town5 OK');$('rtpStatus').textContent='RTP保存済み '+count+' 件'}finally{await reader.close()}}
$('extractRtp').onclick=async()=>{const file=$('officialRtp').files[0];if(!file)return log('公式RTP ZIPを選択してください');$('extractRtp').disabled=$('start').disabled=$('exportRtp').disabled=true;let worker;try{const z=await zipLib(),r=new z.ZipReader(new z.BlobReader(file));let exe;try{const e=(await r.getEntries()).find(e=>!e.directory&&/(^|[\\/])setup\.exe$/i.test(e.filename));if(!e)throw Error('Setup.exeが見つかりません');exe=new File([await e.getData(new z.BlobWriter())],'setup.exe')}finally{await r.close()}$('rtpStatus').textContent='展開中';worker=new Worker('./rtp-worker.js');const blob=await new Promise((resolve,reject)=>{worker.onmessage=e=>{if(e.data.error)reject(Error(e.data.error));else if(e.data.blob)resolve(e.data.blob);else if(e.data.log)log(e.data.log)};worker.onerror=e=>reject(Error(e.message));worker.postMessage(exe)});await saveRtp(blob)}catch(e){log('RTP extraction error: '+e);$('rtpStatus').textContent=String(e)}finally{worker?.terminate();$('extractRtp').disabled=$('start').disabled=$('exportRtp').disabled=false}};
$('exportRtp').onclick=async()=>{try{const root=await rtpRoot();await root.getFileHandle('.complete');const z=await zipLib(),writer=new z.ZipWriter(new z.BlobWriter('application/zip'));for await(const [name,file] of storedFiles(root))await writer.add(name,new z.BlobReader(file),{level:0});const url=URL.createObjectURL(await writer.close());const a=document.createElement('a');a.href=url;a.download='RPGVX_RTP.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){log('RTP export error: '+e)}};
async function mountSavedRtp(fs,sys,mkdir,preflightRoot){let root;try{root=preflightRoot||await rtpRoot();await root.getFileHandle('.complete')}catch(e){if(e.name==='NotFoundError'||!navigator.storage?.getDirectory)return 0;throw e}let count=0;for await(const [name,file] of storedFiles(root)){const dest=sys+'/RTP/RPGVX/'+name;mkdir(dest.slice(0,dest.lastIndexOf('/')));try{fs.writeFile(dest,new Uint8Array(await file.arrayBuffer()))}catch(e){throw Error('RTP file '+name+': '+e.name+' '+e.message)}count++;if(count%25===0)log('RTP mount progress: '+count)}log('OPFS RTP mounted: '+count+' files');return count}

(async()=>{for(const url of ['https://cdn.jsdelivr.net/npm/nostalgist@0.20.2/+esm','https://esm.sh/nostalgist@0.20.2?target=es2022']){try{log('Loading '+url);const m=await import(url);Nostalgist=m.Nostalgist;if(!Nostalgist)throw Error('Missing Nostalgist export');log('Nostalgist loaded');return}catch(e){log('Import failed: '+e)}}log('All library imports failed')})();
$('start').onclick=async()=>{const file=$('file').files[0];if(!file||!Nostalgist){log('ファイルまたはライブラリ未準備');return}if(!crossOriginIsolated){log('先に分離環境を準備してください');return}$('start').disabled=true;try{const base=new URL('./cores/',location.href);log('V17: checking RTP before engine allocation');const selectedRtp=$('rtp').files[0];let savedRtp=null;if(!selectedRtp){try{savedRtp=await rtpRoot();await savedRtp.getFileHandle('.complete');log('RTP storage marker OK')}catch(e){log('RTP preflight: '+e.name+' '+e.message);throw Error('保存済みRTPを読み込めません。展開済みZIPを選択するかRTPを再保存してください')}}let zip=new Uint8Array(await file.arrayBuffer());let dv=new DataView(zip.buffer);let end=-1;for(let i=zip.length-22;i>=Math.max(0,zip.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50&&i+22+dv.getUint16(i+20,true)===zip.length){end=i;break}}if(end<0)throw Error('ZIP central directory not found');let pos=dv.getUint32(end+16,true);const count=dv.getUint16(end+10,true),entries=[];for(let i=0;i<count;i++){if(dv.getUint32(pos,true)!==0x02014b50)throw Error('Invalid ZIP directory');const n=dv.getUint16(pos+28,true),x=dv.getUint16(pos+30,true),c=dv.getUint16(pos+32,true);const raw=zip.slice(pos+46,pos+46+n);const flags=dv.getUint16(pos+8,true);let name;try{name=new TextDecoder('utf-8',{fatal:true}).decode(raw)}catch(e){if(flags&2048)throw e;name=new TextDecoder('shift_jis',{fatal:true}).decode(raw)}entries.push({name,raw,pos,n,x,c,offset:dv.getUint32(pos+42,true)});pos+=46+n+x+c}log('ZIP entries: '+count);for(const e of entries.slice(0,35))log('ZIP '+e.name);const ini=entries.filter(e=>/(^|\/)Game\.ini$/i.test(e.name));if(ini.length!==1)throw Error('Expected one Game.ini, found '+ini.length);const prefix=ini[0].name.slice(0,-8);log('Game root: '+(prefix||'/'));let rom=file;let font=$('font').files[0];if(!font){const response=await fetch('./assets/fonts/umeplus-gothic.ttf');if(!response.ok)throw Error('標準フォント取得失敗: '+response.status);font=new File([await response.blob()],'umeplus-gothic.ttf');log('Standard font loaded: '+font.size)}if(prefix||font){const cut=ini[0].raw.length-8;const parts=[],central=[];let offset=0,centralSize=0;for(const e of entries){if(!e.name.startsWith(prefix)||e.name.length<=prefix.length||e.name.slice(prefix.length)==='Fonts/'+font.name)continue;const name=new TextEncoder().encode(e.name.slice(prefix.length)),p=e.offset;if(dv.getUint32(p,true)!==0x04034b50)throw Error('Invalid local ZIP header');const ln=dv.getUint16(p+26,true),lx=dv.getUint16(p+28,true),size=dv.getUint32(e.pos+20,true);const flags=dv.getUint16(p+6,true);if(flags&8)throw Error('ZIP data descriptor requires repacking');const h=zip.slice(p,p+30);const hv=new DataView(h.buffer);hv.setUint16(26,name.length,true);hv.setUint16(6,flags|2048,true);hv.setUint16(28,0,true);parts.push(h,name,zip.subarray(p+30+ln+lx,p+30+ln+lx+size));const ch=zip.slice(e.pos,e.pos+46);const cd=new DataView(ch.buffer);cd.setUint16(28,name.length,true);cd.setUint16(8,cd.getUint16(8,true)|2048,true);cd.setUint16(30,0,true);cd.setUint16(32,0,true);cd.setUint32(42,offset,true);const tail=new Uint8Array(0);central.push(ch,name,tail);centralSize+=46+name.length+tail.length;offset+=30+name.length+size}if(font){const data=new Uint8Array(await font.arrayBuffer()),name=new TextEncoder().encode('Fonts/'+font.name);let crc=0xffffffff;for(const b of data){crc^=b;for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}crc=(crc^0xffffffff)>>>0;const h=new Uint8Array(30),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,2048,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);parts.push(h,name,data);const ch=new Uint8Array(46),cd=new DataView(ch.buffer);cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);cd.setUint16(8,2048,true);cd.setUint32(16,crc,true);cd.setUint32(20,data.length,true);cd.setUint32(24,data.length,true);cd.setUint16(28,name.length,true);cd.setUint32(42,offset,true);central.push(ch,name,new Uint8Array(0));centralSize+=46+name.length;offset+=30+name.length+data.length;log('Added font: '+font.name+' bytes='+data.length)}const footer=new Uint8Array(22),f=new DataView(footer.buffer);f.setUint32(0,0x06054b50,true);f.setUint16(8,central.length/3,true);f.setUint16(10,central.length/3,true);f.setUint32(12,centralSize,true);f.setUint32(16,offset,true);rom=new File([...parts,...central,footer],'game.mkxpz');log('Flattened ZIP bytes: '+rom.size)}else{log('Game.ini already at ZIP root')}rom=new File([rom],'game.mkxpz');zip=null;dv=null;entries.length=0;log('V17: ZIP working references released');await new Promise(r=>setTimeout(r,100));log('Launching '+rom.name);instance=await Nostalgist.prepare({element:$('canvas'),core:{name:'mkxp-z',js:new URL('mkxp_z_libretro.js',base).href,wasm:new URL('mkxp_z_libretro.wasm',base).href},rom:{fileName:'game.mkxpz',fileContent:rom},emscriptenModule:{print:(m)=>log('STDOUT '+m),printErr:(m)=>log('STDERR '+m)},retroarchCoreConfig:{'mkxp-z_saveStateSize':'64'},retroarchConfig:{system_directory:'/home/web_user/retroarch/userdata/system',log_verbosity:true,stdin_cmd_enable:true,video_shader_enable:false},onLog:(...args)=>log('CORE '+args.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' '))});const fs=instance.getEmscriptenFS();const mod=instance.getEmscripten().Module;log('FS.init: '+typeof fs.init+' / FS.writeFile: '+typeof fs.writeFile+' / FS.readFile: '+typeof fs.readFile+' / EmscriptenSendCommand: '+typeof mod.EmscriptenSendCommand);if(typeof fs.writeFile!=='function'||typeof fs.readFile!=='function')throw Error('FS read/write API missing');const probe='/rgss-fs-probe.txt';fs.writeFile(probe,new Uint8Array([82,71,83,83]));try{if(String(fs.readFile(probe))!=='82,71,83,83')throw Error('FS probe mismatch');log('FS read/write probe OK')}finally{fs.unlink(probe)}const sys='/home/web_user/retroarch/userdata/system/mkxp-z';function mkdir(p){let q='';for(const n of p.split('/').filter(Boolean)){q+='/'+n;try{fs.mkdir(q)}catch(e){if(!fs.stat(q).mode||!(fs.stat(q).mode&16384))throw e}}}mkdir(sys+'/Fonts');fs.writeFile(sys+'/Fonts/'+font.name,new Uint8Array(await font.arrayBuffer()));log('System font installed: '+font.name);const rtp=$('rtp').files[0];if(!rtp){log('Mounting saved RTP');await mountSavedRtp(fs,sys,mkdir,savedRtp);}if(rtp){const z=await import('https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.57/+esm');const reader=new z.ZipReader(new z.BlobReader(rtp));let installed=0;try{for(const entry of await reader.getEntries({filenameEncoding:'shift_jis'})){if(entry.directory)continue;const parts=entry.filename.replaceAll('\\\\','/').split('/');const i=parts.findIndex(n=>['Audio','Graphics','Fonts'].includes(n));if(i<0)continue;const rel=parts.slice(i);if(rel.some(n=>!n||n==='.'||n==='..'||n.includes(':'))||/\\.(dll|exe|ico)$/i.test(rel.at(-1)))continue;const dest=sys+'/RTP/RPGVX/'+rel.join('/');mkdir(dest.slice(0,dest.lastIndexOf('/')));fs.writeFile(dest,await entry.getData(new z.Uint8ArrayWriter()));installed++}}finally{await reader.close()}log('RTP installed: '+installed+' files');if(!installed)throw Error('展開済みRTPがありません。公式RTP ZIP欄を使用してください')}log('V17: inspecting virtual filesystem');try{let count=0;function walk(p,d){if(d>9||count>300)return;for(const n of fs.readdir(p)){if(n==='.'||n==='..'||count++>300)continue;const q=p.replace(/\/$/,'')+'/'+n;try{const st=fs.stat(q);log('FS '+q+' size='+st.size);if((st.mode&61440)===16384&&q!=='/proc'&&q!=='/dev')walk(q,d+1)}catch(e){log('FS stat '+e)}}}walk('/',0)}catch(e){log('FS listing error: '+e)}log('Selected ROM bytes: '+rom.size);try{const p='/home/web_user/retroarch/userdata/content';log('Content entries: '+JSON.stringify(fs.readdir(p)));log('RetroArch config: '+fs.readFile('/home/web_user/retroarch/userdata/retroarch.cfg',{encoding:'utf8'}))}catch(e){log('Content inspection: '+e)}const contentEntries=fs.readdir('/home/web_user/retroarch/userdata/content');if(!contentEntries.includes('game.mkxpz'))throw Error('Expected game.mkxpz missing: '+contentEntries.join(', '));log('ROM extension verified: game.mkxpz');log('Starting core');await instance.start();log('Launch returned');for(const sec of [5,15,30])setTimeout(()=>{log('After '+sec+'s: canvas '+$('canvas').width+'x'+$('canvas').height+' / visibility '+document.visibilityState+' / HEAP '+(mod.HEAPU8?.byteLength??'unknown'))},sec*1000)}catch(e){log('Launch error: '+String(e));log(e.stack||'No stack');$('start').disabled=false}};
