rue);f.setUint32(12,centralSize,true);f.setUint32(16,offset,true);rom=new File([...parts,...central,footer],'game.mkxpz');log('Flattened ZIP bytes: '+rom.size)}else{log('Game.ini already at ZIP root')}rom=new File([rom],'game.mkxpz');log('Launching '+rom.name);instance=await Nostalgist.prepare({element:$('canvas'),core:{name:'mkxp-z',js:new URL('mkxp_z_libretro.js',base).href,wasm:new URL('mkxp_z_libretro.wasm',base).href},rom:{fileName:'game.mkxpz',fileContent:rom},emscriptenModule:{print:(m)=>log('STDOUT '+m),printErr:(m)=>log('STDERR '+m)},retroarchCoreConfig:{'mkxp-z_saveStateSize':'64'},retroarchConfig:{system_directory:'/home/web_user/retroarch/userdata/system',log_verbosity:true,stdin_cmd_enable:true,video_shader_enable:false},onLog:(...args)=>log('CORE '+args.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' '))});const fs=instance.getEmscriptenFS();const mod=instance.getEmscripten().Module;log('FS.init: '+typeof fs.init+' / FS.writeFile: '+typeof fs.writeFile+' / FS.readFile: '+typeof fs.readFile+' / EmscriptenSendCommand: '+typeof mod.EmscriptenSendCommand);if(typeof fs.writeFile!=='function'||typeof fs.readFile!=='function')throw Error('FS read/write API missing');const probe='/rgss-fs-probe.txt';fs.writeFile(probe,new Uint8Array([82,71,83,83]));try{if(String(fs.readFile(probe))!=='82,71,83,83')throw Error('FS probe mismatch');log('FS read/write probe OK')}finally{fs.unlink(probe)}const sys='/home/web_user/retroarch/userdata/system/mkxp-z';function mkdir(p){let q='';for(const n of p.split('/').filter(Boolean)){q+='/'+n;try{fs.mkdir(q)}catch(e){if(!fs.stat(q).mode||!(fs.stat(q).mode&16384))throw e}}}mkdir(sys+'/Fonts');fs.writeFile(sys+'/Fonts/'+font.name,new Uint8Array(await font.arrayBuffer()));log('System font installed: '+font.name);const rtp=$('rtp').files[0];if(rtp){const z=await import('https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.57/+esm');const reader=new z.ZipReader(new z.BlobReader(rtp));let installed=0;try{for(const entry of await reade
