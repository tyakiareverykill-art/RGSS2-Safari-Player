<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>mkxp-z Safari test</title><style>
body{background:#111827;color:white;font:16px system-ui;margin:12px}button,input{font:inherit;margin:5px;padding:12px}canvas{width:100%;max-height:55vh;object-fit:contain;background:black}#pad{display:flex;justify-content:space-between;touch-action:none;user-select:none}#pad button{min-width:54px;min-height:48px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}
</style></head><body><h2>mkxp-z / CRuby 実験版</h2><p id="status"></p><button id="isolate">分離環境を準備・再読込</button><input id="file" type="file" accept=".zip,.mkxpz,.7z"><button id="start">起動</button><canvas id="canvas" width="544" height="416"></canvas><div id="pad"><div><button data-key="ArrowUp">↑</button><br><button data-key="ArrowLeft">←</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button></div><div><button data-key="z">Z</button><button data-key="x">X</button><br><button data-key="Shift">Shift</button><button data-key="Escape">Menu</button></div></div><button id="copylog">ログをコピー</button><pre id="log"></pre><script type="module">
const $=id=>document.getElementById(id), log=m=>{$('log').textContent+=String(m)+'\n';$('log').scrollTop=$('log').scrollHeight};
$('copylog').onclick=async()=>{try{await navigator.clipboard.writeText($('log').textContent)}catch(e){log('Copy error: '+e)}};window.addEventListener('error',e=>log(e.message));window.addEventListener('unhandledrejection',e=>log('Unhandled rejection: '+String(e.reason)+'\n'+(e.reason?.stack||'No stack')));
$('status').textContent='COI: '+crossOriginIsolated+' / SAB: '+(typeof SharedArrayBuffer);
$('isolate').onclick=async()=>{try{if(crossOriginIsolated)return;await navigator.serviceWorker.register('./coi-serviceworker.js',{scope:'./'});await navigator.serviceWorker.ready;log('Service worker ready. Reload manually if not controlled.');location.reload()}catch(e){log(e)}};
let instance, Nostalgist;
const NativeURL=window.URL;
window.URL=new Proxy(NativeURL,{construct(target,args,newTarget){try{return Reflect.construct(target,args,newTarget)}catch(e){const name=String(args[0]),base=String(args[1]||'');if(base.startsWith('blob:'+location.origin+'/')&&(name==='.'||/^mkxp[-_]z_libretro\.(js|wasm)$/.test(name))){const resolved=new NativeURL(name==='.'?'./cores/':'./cores/'+name.replace('mkxp-z','mkxp_z'),location.href);log('Worker URL repaired: '+resolved.href);return resolved}log('URL failure: '+JSON.stringify(args.map(String))+' / '+String(e));throw e}}});
const NativeWorker=window.Worker;
window.Worker=new Proxy(NativeWorker,{construct(target,args,newTarget){log('Worker URL: '+String(args[0]));const w=Reflect.construct(target,args,newTarget);w.addEventListener('error',e=>log('Worker error: '+e.message));return w}});
(async()=>{for(const url of ['https://cdn.jsdelivr.net/npm/nostalgist@0.20.2/+esm','https://esm.sh/nostalgist@0.20.2?target=es2022']){try{log('Loading '+url);const m=await import(url);Nostalgist=m.Nostalgist;if(!Nostalgist)throw Error('Missing Nostalgist export');log('Nostalgist loaded');return}catch(e){log('Import failed: '+e)}}log('All library imports failed')})();
$('start').onclick=async()=>{const file=$('file').files[0];if(!file||!Nostalgist){log('ファイルまたはライブラリ未準備');return}if(!crossOriginIsolated){log('先に分離環境を準備してください');return}$('start').disabled=true;try{const base=new URL('./cores/',location.href);const rom=new File([file],file.name.replace(/\.(zip|7z)$/i,'.mkxpz'));log('Launching '+rom.name);instance=await Nostalgist.prepare({element:$('canvas'),core:{name:'mkxp-z',js:new URL('mkxp_z_libretro.js',base).href,wasm:new URL('mkxp_z_libretro.wasm',base).href},rom:{fileName:'game.mkxpz',fileContent:rom},emscriptenModule:{print:(m)=>log('STDOUT '+m),printErr:(m)=>log('STDERR '+m)},retroarchConfig:{log_verbosity:true,stdin_cmd_enable:true,video_shader_enable:false},onLog:(...args)=>log('CORE '+args.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' '))});const fs=instance.getEmscriptenFS();const mod=instance.getEmscripten().Module;log('FS.init: '+typeof fs.init+' / FS.writeFile: '+typeof fs.writeFile+' / FS.readFile: '+typeof fs.readFile+' / EmscriptenSendCommand: '+typeof mod.EmscriptenSendCommand);if(typeof fs.writeFile!=='function'||typeof fs.readFile!=='function')throw Error('FS read/write API missing');const probe='/rgss-fs-probe.txt';fs.writeFile(probe,new Uint8Array([82,71,83,83]));try{if(String(fs.readFile(probe))!=='82,71,83,83')throw Error('FS probe mismatch');log('FS read/write probe OK')}finally{fs.unlink(probe)}log('V11: inspecting virtual filesystem');try{let count=0;function walk(p,d){if(d>9||count>300)return;for(const n of fs.readdir(p)){if(n==='.'||n==='..'||count++>300)continue;const q=p.replace(/\/$/,'')+'/'+n;try{const st=fs.stat(q);log('FS '+q+' size='+st.size);if((st.mode&61440)===16384&&q!=='/proc'&&q!=='/dev')walk(q,d+1)}catch(e){log('FS stat '+e)}}}walk('/',0)}catch(e){log('FS listing error: '+e)}log('Selected ROM bytes: '+rom.size);try{const p='/home/web_user/retroarch/userdata/content';log('Content entries: '+JSON.stringify(fs.readdir(p)));log('RetroArch config: '+fs.readFile('/home/web_user/retroarch/userdata/retroarch.cfg',{encoding:'utf8'}))}catch(e){log('Content inspection: '+e)}const entries=fs.readdir('/home/web_user/retroarch/userdata/content');if(!entries.includes('game.mkxpz'))throw Error('Expected game.mkxpz missing: '+entries.join(', '));log('ROM extension verified: game.mkxpz');log('Starting core');await instance.start();log('Launch returned');for(const sec of [5,15,30])setTimeout(()=>{log('After '+sec+'s: canvas '+$('canvas').width+'x'+$('canvas').height+' / visibility '+document.visibilityState+' / HEAP '+(mod.HEAPU8?.byteLength??'unknown'))},sec*1000)}catch(e){log('Launch error: '+String(e));log(e.stack||'No stack');$('start').disabled=false}};
for(const b of document.querySelectorAll('[data-key]')){const key=b.dataset.key;const send=(type)=>{const code=key.length===1?'Key'+key.toUpperCase():key==='Shift'?'ShiftLeft':key;const ev=new KeyboardEvent(type,{key,code,bubbles:true,cancelable:true});$('canvas').dispatchEvent(ev)};b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);send('keydown')};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>send('keyup')}
</script></body></html>
