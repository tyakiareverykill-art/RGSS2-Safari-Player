<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGSS2 Safari 診断</title><style>body{font:16px system-ui;background:#101827;color:#eee;padding:20px;max-width:680px;margin:auto}li{padding:12px;border-bottom:1px solid #445}button{padding:12px;font:inherit}pre{white-space:pre-wrap}</style><h1>RGSS2 Safari 動作診断</h1><p>このページはブラウザの機能を確認します。ゲーム実行テストではありません。</p><button id="run">診断開始</button><ul id="out"></ul><button id="copy">結果をコピー</button><pre id="info"></pre><script>
const out=document.querySelector('#out'),info=document.querySelector('#info');
async function test(){out.replaceChildren();const checks=[['WebAssembly',()=>WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0]))],['JSPI',()=>typeof WebAssembly.Suspending==='function'&&typeof WebAssembly.promising==='function'],['WebGL 2',()=>!!document.createElement('canvas').getContext('webgl2')],['WebGL 1',()=>!!document.createElement('canvas').getContext('webgl')],['IndexedDB',()=>new Promise((resolve,reject)=>{const r=indexedDB.open('rgss-diagnostic',1);r.onsuccess=()=>{r.result.close();resolve(true)};r.onerror=()=>reject(r.error)})],['File API',()=>typeof File==='function'&&typeof Blob.prototype.arrayBuffer==='function'],['AudioContext',()=>!!(window.AudioContext||window.webkitAudioContext)],['Touch',()=>navigator.maxTouchPoints>0],['Secure context',()=>isSecureContext]];for(const [name,fn] of checks){let result;try{result=await fn()?'OK':'Unavailable'}catch(e){result='Error: '+e.message}const li=document.createElement('li');li.textContent=name+': '+result;out.append(li)}info.textContent=navigator.userAgent+'\n'+innerWidth+' x '+innerHeight+' / DPR '+devicePixelRatio; }
document.querySelector('#run').onclick=test;document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(out.innerText+'\n'+info.textContent)}catch(e){alert('コピーできません。画面を撮影してください。')}};test();
</script></html>
