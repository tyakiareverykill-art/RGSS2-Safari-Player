<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGSS2 ミニゲーム試験</title>
<style>
body { color: #f8fafc; background: #111827; font: 16px system-ui; margin: 16px auto; padding: 0 16px; max-width: 580px }
canvas { display: block; width: 100%; aspect-ratio: 544 / 416; background: #080d16 }
button { font: inherit; min-height: 48px; padding: 8px 14px; touch-action: none; user-select: none; -webkit-touch-callout: none }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 }
pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto }
</style>
<h1>RGSS2 ミニゲーム試験</h1>
<p>既存のmkxp-zコアで描画・操作・一時セーブを試します。</p>
<button id="start">試験を開始</button>
<p id="status" role="status">青い四角を動かし、保存した位置に戻れるか試してください。</p>
<canvas id="screen" width="544" height="416" tabindex="0"></canvas>
<nav aria-label="ゲーム操作">
  <button data-button="left">左</button>
  <button data-button="right">右</button>
  <button data-button="a">位置を保存</button>
  <button data-button="b">位置を復元</button>
</nav>
<details open><summary>実行ログ</summary><pre id="log"></pre></details>
<script type="module" src="./smoke.mjs"></script>
</html>
