<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGSS V2 診断</title><style>body{font:16px system-ui;background:#111827;color:white;padding:16px}button,input{font:inherit;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>RGSS Safari Player V2 — I/O試作</h1><p>ゲームは起動しません。選択したファイルを変更せず、Worker内の部分読み込みを測定します。</p><input id="file" type="file" accept=".zip,.mkxpz"><button id="run">診断開始</button><button id="save">ログ保存</button><pre id="out"></pre><script>
const out=document.getElementById('out'),run=document.getElementById('run');let worker,url,timer;function log(x){out.textContent+=x+'\n'}function stop(){clearTimeout(timer);worker?.terminate();if(url)URL.revokeObjectURL(url);run.disabled=false}run.onclick=()=>{const f=document.getElementById('file').files[0];if(!f)return log('ファイルを選択してください');run.disabled=true;out.textContent='';log('Bytes: '+f.size);log('Cross-origin isolated: '+crossOriginIsolated);log('SharedArrayBuffer: '+typeof SharedArrayBuffer);log('OffscreenCanvas: '+typeof OffscreenCanvas);const canvas=document.createElement('canvas');log('WebGL: '+!!canvas.getContext('webgl'));const c=document.createElement('canvas');log('WebGL2: '+!!c.getContext('webgl2'));try{url=URL.createObjectURL(new Blob([`onmessage=async({data:f})=>{try{const t=performance.now();const reader=new FileReaderSync();let sum=0;for(let i=0;i<64;i++){const offset=Math.floor(Math.max(0,f.size-65536)*i/63);const a=new Uint8Array(reader.readAsArrayBuffer(f.slice(offset,offset+65536)));sum+=a[0]||0}postMessage('64 partial reads: '+(performance.now()-t).toFixed(1)+' ms; checksum '+sum);postMessage('OPFS API: '+typeof navigator.storage?.getDirectory);postMessage('DONE')}catch(e){postMessage('ERROR '+e.message)}}`],{type:'text/javascript'}));worker=new Worker(url);worker.onmessage=e=>{log(e.data);if(e.data==='DONE'||e.data.startsWith('ERROR'))stop()};worker.onerror=e=>{log(e.message);stop()};timer=setTimeout(()=>{log('TIMEOUT');stop()},30000);worker.postMessage(f)}catch(e){log(e.message);stop()}};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out.textContent],{type:'text/plain'}));a.download='rgss-v2-diagnostics.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
