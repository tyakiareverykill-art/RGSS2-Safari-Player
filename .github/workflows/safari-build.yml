name: Safari experimental build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/safari-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch upstream
        run: git clone --depth 1 https://github.com/Dim145/mkxp-web-jspi.git engine
      - name: Configure Asyncify
        working-directory: engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('mkxp-web/CMakeLists.txt')
          s=p.read_text()
          s,n=re.subn(r'(?m)^SET\(ASYNCIFY .*\)$', 'SET(ASYNCIFY "-s ASYNCIFY=1 -s ASYNCIFY_STACK_SIZE=8388608")',s)
          assert n==1,n
          p.write_text(s)
          for p in [Path('mkxp-web/CMakeLists.txt'), Path('mkxp-web/extra/build_config.rb')]:
              s=p.read_text()
              s,n=re.subn(r'-fwasm-exceptions -s\s*SUPPORT_LONGJMP=wasm', '-fexceptions -sSUPPORT_LONGJMP=emscripten', s)
              assert n>=1, str(p)
              p.write_text(s)
          p=Path('mkxp-web/binding-mruby/binding-mruby.cpp')
          s=p.read_text()
          assert 'static bool mkxpLoadTrace = false;' in s
          s=s.replace('static bool mkxpLoadTrace = false;', 'static bool mkxpLoadTrace = true;')
          s=s.replace('scriptArray = mrb_marshal_load(mrb, rawdata);', 'fprintf(stderr, "[RGSS TRACE] Scripts Marshal begin\\n"); fflush(stderr);\n        scriptArray = mrb_marshal_load(mrb, rawdata);\n        fprintf(stderr, "[RGSS TRACE] Scripts Marshal returned\\n"); fflush(stderr);')
          s=s.replace('mrb_value rawdata = mrb_str_new_static(mrb, contents, fileHelper.length);', 'fprintf(stderr, "[RGSS TRACE] Scripts bytes=%d header=%02x %02x\\n", fileHelper.length, fileHelper.length>0?(unsigned char)contents[0]:0, fileHelper.length>1?(unsigned char)contents[1]:0); fflush(stderr);\n        mrb_value rawdata = mrb_str_new(mrb, contents, fileHelper.length);')
          start=s.index('SDL_rw_file_helper fileHelper;', s.index('std::string readError;'))
          end=s.index('scriptArray = mrb_marshal_load', start)
          s=s[:start]+'''SDL_RWops ops;
        shState->fileSystem().openReadRaw(ops, scriptPack.c_str());
        Sint64 size = SDL_RWsize(&ops);
        if (size <= 0 || size > 268435456) {
            SDL_RWclose(&ops);
            showError("Invalid script archive entry size");
            mrb_close(scriptMrb);
            return;
        }
        std::string bytes((size_t)size, char(0));
        size_t got = SDL_RWread(&ops, &bytes[0], 1, (size_t)size);
        SDL_RWclose(&ops);
        fprintf(stderr, "[RGSS TRACE] PhysFS scripts bytes=%zu expected=%lld\\\\n", got, (long long)size);
        fflush(stderr);
        if (got != (size_t)size) {
            showError("Incomplete script archive read");
            mrb_close(scriptMrb);
            return;
        }
        mrb_value rawdata = mrb_str_new(mrb, bytes.data(), bytes.size());
        '''+s[end:]
          p.write_text(s)
          PY
      - uses: docker/setup-buildx-action@v3
      - name: Build toolchain with persistent cache
        uses: docker/build-push-action@v6
        with:
          context: engine
          tags: mkxp-web-jspi:latest
          load: true
          cache-from: type=gha,scope=rgss2-toolchain
          cache-to: type=gha,scope=rgss2-toolchain,mode=max
      - name: Compile
        working-directory: engine
        run: docker run --rm -v "$PWD/mkxp-web:/src/mkxp-web" -v "$PWD/build-mkxp.sh:/build-mkxp.sh" mkxp-web-jspi /build-mkxp.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-engine-asyncify
          path: |
            engine/mkxp-web/build/mkxp.wasm
            engine/mkxp-web/build/mkxp.js
          if-no-files-found: error
