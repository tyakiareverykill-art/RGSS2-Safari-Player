name: Publish engine diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostic-pages.yml', 'docs/player.html', 'docs/engine-test.html']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mkxp-engine-asyncify
          run-id: 45406800572
          github-token: ${{ github.token }}
          path: site
      - name: Prepare diagnostic
        run: |
          test -s site/mkxp.wasm
          test -s site/mkxp.js
          cp docs/engine-test.html site/diagnostic.html
          cp docs/player.html site/index.html
          npm pack fflate@0.8.2 --silent
          tar -xOf fflate-0.8.2.tgz package/umd/index.js > site/fflate.js
          printf '\n;window.RGSSBridge={fs:typeof FS!=="undefined"?FS:Module.FS,main:typeof callMain==="function"?callMain:Module.callMain};\n' >> site/mkxp.js
          ls -lh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              sleep 10
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
