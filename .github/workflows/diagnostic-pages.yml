name: Publish engine diagnostic
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Safari experimental build']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostic-pages.yml', 'docs/player.html', 'docs/engine-test.html', 'docs/mkxpz-test.html']
concurrency:
  group: github-pages
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Select successful engine build
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          id="$TRIGGER_RUN"
          if [ -z "$id" ]; then
            id=$(gh run list --workflow safari-build.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$id" && test "$id" != null
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: mkxp-engine-asyncify
          run-id: ${{ steps.engine.outputs.id }}
          github-token: ${{ github.token }}
          path: site
      - name: Prepare diagnostic
        run: |
          test -s site/mkxp.wasm
          test -s site/mkxp.js
          cp docs/engine-test.html site/diagnostic.html
          cp docs/player.html site/index.html
          mkdir -p site/mkxpz/cores
          cp docs/mkxpz-test.html site/mkxpz/index.html
          printf '%s\n' '<meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./mkxpz/"><a href="./mkxpz/">mkxp-z test</a>' > site/mkxpz-test.html
          test -s site/mkxpz-test.html
          npm pack fflate@0.8.2 --silent
          tar -xOf fflate-0.8.2.tgz package/umd/index.js > site/fflate.js
          printf '\n;window.RGSSBridge={fs:typeof FS!=="undefined"?FS:Module.FS,main:typeof callMain==="function"?callMain:Module.callMain};\n' >> site/mkxp.js
          ls -lh site
      - name: Prepare optional mkxp-z core (isolated scope)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p site/mkxpz/cores
          curl -fLsS --max-time 60 https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.js -o site/mkxpz/coi-serviceworker.js
          tmp=$(mktemp -d)
          gh release download v0.1.0 -R zjl4/mkxp-z-libretro-emscripten --dir "$tmp"
          python3 - "$tmp" <<'PY'
          import pathlib, sys, tarfile, zipfile
          root=pathlib.Path(sys.argv[1])
          out=pathlib.Path('site/mkxpz/cores')
          def save(name, data):
              name=pathlib.PurePosixPath(name).name
              for ext in ('js','wasm'):
                  if name in ('mkxp-z_libretro.'+ext,'mkxp_z_libretro.'+ext):
                      (out/('mkxp_z_libretro.'+ext)).write_bytes(data())
          for p in root.iterdir():
              if tarfile.is_tarfile(p):
                  with tarfile.open(p) as t:
                      for m in t:
                          if m.isfile(): save(m.name,lambda: t.extractfile(m).read())
              elif zipfile.is_zipfile(p):
                  with zipfile.ZipFile(p) as z:
                      for n in z.namelist(): save(n,lambda: z.read(n))
              else: save(p.name,p.read_bytes)
          assert (out/'mkxp_z_libretro.js').stat().st_size > 0
          assert (out/'mkxp_z_libretro.wasm').open('rb').read(4)==b'\\x00asm'
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              sleep 10
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
